<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DummyDevBoxApp — Fullstack Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #34d399;
      --accent: #818cf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
      margin-bottom: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
    .card h3 {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .card .value {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    pre {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.875rem;
      color: #e2e8f0;
      max-height: 250px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">● Isolated Guest VM Execution Active</div>
      <h1>DummyDevBoxApp Dashboard</h1>
      <p style="color: var(--text-muted);">Decoupled Full-Stack Architecture running on DevBox KVM</p>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Architecture Tier</h3>
        <div class="value" id="tier-val">Frontend + Backend</div>
      </div>
      <div class="card">
        <h3>Hypervisor Proxy</h3>
        <div class="value" id="proxy-val">Port 3002 &rarr; 3000</div>
      </div>
      <div class="card">
        <h3>Environment Source</h3>
        <div class="value" id="env-val">.env active</div>
      </div>
    </div>

    <div class="card" style="margin-bottom: 1.5rem;">
      <h3>Interactive Backend Controls</h3>
      <div class="actions" style="margin-top: 0.75rem;">
        <button onclick="fetchStatus()">Refresh Status (/api/status)</button>
        <button class="secondary" onclick="fetchPing()">Ping Backend (/api/ping)</button>
      </div>
      <pre id="log-output">Connecting to backend API...</pre>
    </div>
  </div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('log-output').textContent = JSON.stringify(data, null, 2);
        if (data.envLoaded) {
          document.getElementById('env-val').textContent = data.customConfig || '.env active';
        }
      } catch (err) {
        document.getElementById('log-output').textContent = 'Error: ' + err.message;
      }
    }

    async function fetchPing() {
      try {
        const res = await fetch('/api/ping');
        const data = await res.json();
        document.getElementById('log-output').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('log-output').textContent = 'Error: ' + err.message;
      }
    }

    // Auto-fetch on load
    fetchStatus();
  </script>
</body>
</html>
